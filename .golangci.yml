version: "2"
run:
  concurrency: 4
  go: "1.26"
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - durationcheck
    - errname
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - misspell
    - mnd
    - modernize
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    goconst:
      # Tests: see linters.exclusions.rules (*_test.go). ignore-tests is kept for linters that honor it only here.
      ignore-tests: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: stutter
      - linters:
          - revive
        text: unused-parameter
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)demo/
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)demo/
