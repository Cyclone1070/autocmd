version: "2"

run:
  timeout: 5m
  concurrency: 4
  go: "1.26"

linters:
  enable:
    - modernize
    - revive
    - asciicheck
    - bodyclose
    - dogsled
    - durationcheck
    - errname
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - godot
    - mnd
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - unused
  
  settings:
    govet:
      enable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: redefines-builtin-id

  exclusions:
    presets: []
    paths:
      - "demo/.*"
    rules:
      - path: internal/provider/registry.go
        linters:
          - revive
      - path: internal/tool/bash/bash.go
        linters:
          - revive
      - path: internal/tool/question/question.go
        linters:
          - revive
      - text: "stutter"
        linters:
          - revive
      - text: "unused-parameter"
        linters:
          - revive
